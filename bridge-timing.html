<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugiyama Bridge timing check</title><style>body{font:16px system-ui;margin:24px auto;padding:0 18px;max-width:850px;color:#172b20}button{font:inherit;padding:12px 16px;border-radius:8px;border:1px solid #24613b;background:#24613b;color:white;cursor:pointer}button:disabled{opacity:.5}article{padding:14px;border:1px solid #cdd8d0;border-radius:10px;margin:14px 0}pre{white-space:pre-wrap;font-size:14px}small{display:block;margin-top:8px;color:#555}</style></head><body><h1>Sugiyama Bridge timing check</h1><p>Checks released Days, Day 1 Study, the Manage list, and A–Z Study. Vocabulary is read but not displayed or changed.</p><button id="run">Run read checks</button><p id="status" role="status">Ready.</p><div id="results"></div><script>
const bridge='https://script.google.com/macros/s/AKfycbxpFRJH_TCEIA5SbFzhOrZuD4W3II6l6numpcXK6NLkyrLw5C3hXS2u_r5v7eSC1Yrk/exec';
const storageKey='sugiyama_bridge_timing_checks_v1';
let records=[];try{records=JSON.parse(localStorage.getItem(storageKey))||[]}catch{}
const run=document.getElementById('run'),status=document.getElementById('status'),results=document.getElementById('results');
function save(){try{localStorage.setItem(storageKey,JSON.stringify(records.slice(-20)))}catch{}}
function timingText(d){if(!d||!Array.isArray(d.steps))return 'Bridge timing data is unavailable. Deploy the direct-timing Bridge first.';return 'Action: '+d.action+'\nBridge total: '+(d.elapsedMs/1000).toFixed(3)+' s\n'+d.steps.map(s=>s.phase+': '+(s.elapsedMs/1000).toFixed(3)+' s ('+s.status+')').join('\n')+'\nNested phase times overlap; do not add them together.';}
async function post(payload){const c=new AbortController();let deadline;const transfer=(async()=>{const r=await fetch(bridge,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return JSON.parse(await r.text())})();try{return await Promise.race([transfer,new Promise((_,reject)=>{deadline=setTimeout(()=>{c.abort();reject(Error('Browser stopped waiting after 15 seconds.'))},15000)})])}finally{clearTimeout(deadline)}}
function render(){results.replaceChildren();for(const rec of records.slice(-20).reverse()){const article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),pre=document.createElement('pre');h.textContent=rec.label;p.textContent=rec.time+' — '+rec.state+(rec.browserMs!==undefined?' — Browser '+(rec.browserMs/1000).toFixed(1)+' s':'');pre.textContent=rec.diagnostics?timingText(rec.diagnostics):(rec.note||'Timing not returned.');article.append(h,p,pre);if(!rec.diagnostics){const b=document.createElement('button');b.textContent='Retrieve completed timing';b.onclick=async()=>{b.disabled=true;try{const d=await post({action:'diagnostics',traceId:rec.id});if(!d.ok)throw Error(d.error||'Diagnostic retrieval failed.');if(d.available&&d.diagnostics){rec.diagnostics=d.diagnostics;rec.note='';}else rec.note='No completed timing is available yet. The request may still be running, or its temporary timing record may have expired.';}catch(e){rec.note=e.message}finally{save();render()}};article.append(b);const note=document.createElement('small');note.textContent='For a timed-out request, retrieve after it finishes. This does not repeat the original read.';article.append(note)}results.append(article)}}
run.onclick=async()=>{run.disabled=true;status.textContent='Running read checks…';try{for(const [label,payload] of [['Released Days',{action:'days'}],['Day 1 Study',{action:'study',sheet:'Day 1'}],['Day 1 Manage list',{action:'list',sheet:'Day 1'}],['A–Z Study',{action:'study',sheet:'A-Z Word Bank'}]]){const rec={id:'check_'+Date.now()+'_'+Math.random().toString(36).slice(2,10),label,time:new Date().toLocaleString(),state:'Running'};records.push(rec);save();render();const started=Date.now();try{const d=await post({...payload,diagnostics:true,traceId:rec.id});rec.browserMs=Date.now()-started;rec.diagnostics=d.diagnostics||null;rec.state=d.ok?'Completed':'Bridge rejected request';if(!d.ok)rec.note=d.error||'Request failed.';save();render();if(!d.ok||!d.diagnostics){status.textContent='Check stopped: Bridge timing is unavailable or the request failed.';return}}catch(e){rec.browserMs=Date.now()-started;rec.state='No confirmed reply';rec.note=e.message;save();render();status.textContent='Check stopped. Retrieve the completed timing later.';return}}status.textContent='Read checks completed.'}finally{run.disabled=false}};render();
</script></body></html>
